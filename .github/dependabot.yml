# Weekly dependency updates, each arriving as a pull request that has to pass CI.
# A cooldown holds back brand-new releases for a week (a compromised
# package is usually caught and pulled within that window); security updates
# are not delayed by it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # Node's type definitions follow the Node major the site runs on
      # (engines.node and the Dockerfile), so a major moves with those by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # On hold until Next.js's ESLint config supports them (checked 2026-10-14).
      # Remove each rule once eslint-config-next's plugins accept the new major.
      # TypeScript 7: typescript-eslint refuses it, so `npm run lint` fails (#7).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10: CI passes, but eslint-plugin-react, -jsx-a11y and -import
      # (bundled by eslint-config-next) only declare support up to ESLint 9 (#8).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      # Released together and pinned exactly; they must move together.
      nextjs:
        patterns: ["next", "@next/*", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      minor-and-patch:
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
